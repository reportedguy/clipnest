# On a version tag (v1.2.3), builds the Windows installer, writes SHA-256 checksums and
# creates a *draft* GitHub release with both attached and the matching CHANGELOG.md
# section as the notes. Review the draft on GitHub, then press "Publish release".
# See docs/releasing.md.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # creating the release

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Check
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Test Rust
        working-directory: src-tauri
        run: |
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} doesn't match tauri.conf.json version $version" }

      - name: Build installer
        run: pnpm tauri build

      # Code signing hook. Unsigned builds work; Windows SmartScreen warns until the
      # download builds reputation. To sign through SignPath Foundation (free for open
      # source), add their action here; see docs/releasing.md. No code changes needed.
      # - name: Sign installer
      #   uses: signpath/github-action-submit-signing-request@v1
      #   with: { ... }

      - name: Checksums and release notes
        shell: pwsh
        run: |
          $out = "src-tauri/target/release/bundle/nsis"
          Get-ChildItem $out -Filter *.exe | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content "$out/SHA256SUMS.txt" -Encoding ascii
          Get-Content "$out/SHA256SUMS.txt"

          # The CHANGELOG.md section for this version, without its heading.
          $version = "${{ github.ref_name }}".TrimStart("v")
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String -Pattern "^## \[$([regex]::Escape($version))\]").LineNumber
          if (-not $start) { $notes = "See CHANGELOG.md." } else {
            $rest = $lines[$start..($lines.Count - 1)]
            $end = ($rest | Select-String -Pattern "^## \[|^\[").LineNumber | Select-Object -First 1
            $notes = ($(if ($end) { $rest[0..($end - 2)] } else { $rest })) -join "`n"
          }
          $notes += "`n`n**Install:** download the setup .exe below. It's unsigned, so Windows may show `"Windows protected your PC`": click More info, then Run anyway. Checksums are in SHA256SUMS.txt."
          Set-Content release-notes.md $notes -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: clipnest-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/SHA256SUMS.txt

      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: ClipNest ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
